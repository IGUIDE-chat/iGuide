version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/app"
    schedule:
      interval: "cron"
      cronjob: "30 11 * * 3,6"
    open-pull-requests-limit: 10

  - package-ecosystem: "npm"
    directory: "/api"
    schedule:
      interval: "cron"
      cronjob: "30 11 * * 3,6"
    open-pull-requests-limit: 10

  - package-ecosystem: "pip"
    directory: "/data_collection"
    schedule:
      interval: "cron"
      cronjob: "30 11 * * 3,6"
    open-pull-requests-limit: 10

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "cron"
      cronjob: "30 11 * * 3,6"
    open-pull-requests-limit: 5
