name: CI

on:
  pull_request:
    branches: [main, production, feature/dorm-compare]
  push:
    branches: [main, production, feature/dorm-compare]

jobs:
  # ─────────────────────────────────────────────
  # Job 1: Source code secret scan
  # Catch sensitive keys in source BEFORE build
  # ─────────────────────────────────────────────
  secret-scan:
    name: Secret Scan (Source)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Block any VITE_-prefixed sensitive key in source code
      - name: Check for VITE_-prefixed sensitive keys in source
        run: |
          echo "Scanning for VITE_-prefixed sensitive keys in src/..."
          FOUND=0

          # These patterns indicate a sensitive key was accidentally given VITE_ prefix
          PATTERNS=(
            "VITE_.*API_KEY"
            "VITE_.*API_TOKEN"
            "VITE_.*SECRET"
            "VITE_DEEPSEEK"
            "VITE_TAVILY"
            "VITE_COZE_API"
            "VITE_GOOGLE_API"
            "VITE_GEMINI_API"
          )

          for pattern in "${PATTERNS[@]}"; do
            matches=$(grep -rn --include="*.ts" --include="*.tsx" --include="*.js" \
              "$pattern" app/src/ 2>/dev/null || true)
            if [ -n "$matches" ]; then
              echo "❌ Found forbidden VITE_ prefixed key: $pattern"
              echo "$matches"
              FOUND=1
            fi
          done

          if [ "$FOUND" -eq 1 ]; then
            echo ""
            echo "🔴 SECURITY VIOLATION: Sensitive API keys with VITE_ prefix detected!"
            echo "   VITE_-prefixed variables are compiled into the frontend JS bundle."
            echo "   Use CF Pages Functions (functions/api/*.ts) to proxy these keys server-side."
            exit 1
          fi

          echo "✅ No sensitive VITE_-prefixed keys found in source."

      # Block hardcoded key values (real key patterns)
      - name: Check for hardcoded API key values
        run: |
          echo "Scanning for hardcoded API key values..."
          FOUND=0

          # Common key prefixes that should NEVER appear as literal values
          PATTERNS=(
            "tvly-[A-Za-z0-9_-]{20,}"
            "pat_[A-Za-z0-9]{40,}"
            "sk-[a-f0-9]{32,}"
            "pk\.eyJ1Ijoi[A-Za-z0-9_-]{20,}"
          )

          for pattern in "${PATTERNS[@]}"; do
            matches=$(grep -rEn --include="*.ts" --include="*.tsx" --include="*.js" --include="*.json" \
              "$pattern" app/src/ 2>/dev/null || true)
            # Exclude .env files and example files
            matches=$(echo "$matches" | grep -v "\.env" | grep -v "example" || true)
            if [ -n "$matches" ]; then
              echo "❌ Found hardcoded API key value matching: $pattern"
              echo "$matches" | sed 's/\(.\{60\}\).*/\1.../' # truncate for safety
              FOUND=1
            fi
          done

          if [ "$FOUND" -eq 1 ]; then
            echo ""
            echo "🔴 SECURITY VIOLATION: Hardcoded API key values detected in source!"
            exit 1
          fi

          echo "✅ No hardcoded API key values found."

  # ─────────────────────────────────────────────
  # Job 2: TypeCheck & Build
  # ─────────────────────────────────────────────
  check:
    name: TypeCheck & Build
    runs-on: ubuntu-latest
    needs: secret-scan
    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: pnpm ci

      - name: TypeCheck
        run: pnpm run typecheck

      - name: Build
        run: pnpm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_MAPBOX_TOKEN: ${{ secrets.VITE_MAPBOX_TOKEN }}
          VITE_COZE_BOT_ID: ${{ secrets.VITE_COZE_BOT_ID }}

  # ─────────────────────────────────────────────
  # Job 3: Bundle secret scan
  # Verify the compiled dist/ has no leaked keys
  # ─────────────────────────────────────────────
  bundle-scan:
    name: Bundle Secret Scan (dist)
    runs-on: ubuntu-latest
    needs: check
    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: pnpm ci

      - name: Build (for bundle scan)
        run: pnpm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_MAPBOX_TOKEN: ${{ secrets.VITE_MAPBOX_TOKEN }}
          VITE_COZE_BOT_ID: ${{ secrets.VITE_COZE_BOT_ID }}

      - name: Scan compiled bundle for leaked secrets
        run: |
          echo "Scanning dist/assets/ for leaked API keys..."
          FOUND=0

          PATTERNS=(
            "tvly-[A-Za-z0-9_-]{20,}"
            "pat_[A-Za-z0-9]{40,}"
            "sk-[a-f0-9]{32,}"
            "DEEPSEEK_API_KEY"
            "TAVILY_API_KEY"
            "GOOGLE_API_KEY"
            "GEMINI_API_KEY"
            "COZE_API_TOKEN"
          )

          for pattern in "${PATTERNS[@]}"; do
            matches=$(grep -rEn "$pattern" dist/assets/ 2>/dev/null || true)
            if [ -n "$matches" ]; then
              echo "❌ Leaked secret found in bundle: $pattern"
              echo "$matches" | head -3 | sed 's/\(.\{80\}\).*/\1.../'
              FOUND=1
            fi
          done

          if [ "$FOUND" -eq 1 ]; then
            echo ""
            echo "🔴 SECURITY VIOLATION: Sensitive keys detected in compiled JS bundle!"
            echo "   This means a key leaked into the frontend. Check vite.config.ts define{} block."
            exit 1
          fi

          echo "✅ Bundle is clean — no sensitive keys found in dist/assets/."

      - name: Verify CF Functions exist for sensitive APIs
        run: |
          echo "Verifying CF Pages Functions proxy files exist..."
          MISSING=0

          for fn in functions/api/deepseek.ts functions/api/tavily.ts functions/api/gemini.ts; do
            if [ ! -f "$fn" ]; then
              echo "❌ Missing CF Function proxy: $fn"
              MISSING=1
            else
              echo "✅ $fn"
            fi
          done

          if [ "$MISSING" -eq 1 ]; then
            echo "🔴 Required CF Function proxy files are missing!"
            exit 1
          fi

  # ─────────────────────────────────────────────
  # Job 4: Deploy status
  # ─────────────────────────────────────────────
  deploy-status:
    name: Cloudflare Deploy Status
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    needs: [check, bundle-scan]
    steps:
      - name: Notify deploy triggered
        run: |
          echo "✅ All CI checks passed."
          echo "   → TypeCheck:    passed"
          echo "   → Build:        passed"
          echo "   → Secret scan:  passed (source + bundle)"
          echo "   → Cloudflare Pages will auto-deploy this push."
