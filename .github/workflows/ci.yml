name: CI

on:
  pull_request:
    branches: [main, production, feature/dorm-compare]
  push:
    branches: [main, production, feature/dorm-compare]

jobs:
  secret-scan:
    name: Secret Scan (Source)
    uses: ./.github/workflows/secret-scan.yml
    with:
      ref: ${{ github.ref }}
      full_repo_name: ${{ github.repository }}

  build:
    name: Lint, TypeCheck & Build
    needs: secret-scan
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ github.ref }}
    secrets:
      vite_supabase_url: ${{ secrets.VITE_SUPABASE_URL }}
      vite_supabase_anon_key: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      vite_mapbox_token: ${{ secrets.VITE_MAPBOX_TOKEN }}
      vite_coze_bot_id: ${{ secrets.VITE_COZE_BOT_ID }}

  bundle-scan:
    name: Bundle Secret Scan (dist)
    needs: build
    uses: ./.github/workflows/bundle-scan.yml
    with:
      ref: ${{ github.ref }}
    secrets:
      vite_supabase_url: ${{ secrets.VITE_SUPABASE_URL }}
      vite_supabase_anon_key: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      vite_mapbox_token: ${{ secrets.VITE_MAPBOX_TOKEN }}
      vite_coze_bot_id: ${{ secrets.VITE_COZE_BOT_ID }}

  deploy:
    name: Cloudflare Deploy Status
    needs: [build, bundle-scan]
    uses: ./.github/workflows/deploy.yml