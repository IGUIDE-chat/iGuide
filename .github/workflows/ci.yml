name: CI

on:
  pull_request:
    branches: [main, production]
  push:
    branches: [main, production]

jobs:
  check:
    name: TypeCheck & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: illiniguide---uiuc-knowledge-base

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: illiniguide---uiuc-knowledge-base/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeCheck
        run: npm run typecheck

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_MAPBOX_TOKEN: ${{ secrets.VITE_MAPBOX_TOKEN }}

  deploy-status:
    name: Cloudflare Deploy Status
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    needs: check
    steps:
      - name: Notify deploy triggered
        run: echo "✅ CI passed. Cloudflare Pages will auto-deploy this push."
