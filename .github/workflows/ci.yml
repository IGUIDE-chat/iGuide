name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Secret scan (source)
        run: |
          echo "Scanning for VITE_-prefixed sensitive keys in apps/web/src/..."
          FOUND=0

          VITE_PATTERNS=(
            "VITE_.*API_KEY"
            "VITE_.*API_TOKEN"
            "VITE_.*SECRET"
            "VITE_DEEPSEEK"
            "VITE_TAVILY"
            "VITE_COZE_API"
            "VITE_GOOGLE_API"
            "VITE_GEMINI_API"
          )

          for pattern in "${VITE_PATTERNS[@]}"; do
            matches=$(grep -rn --include="*.ts" --include="*.tsx" --include="*.js" \
              "$pattern" apps/web/src/ 2>/dev/null || true)
            if [ -n "$matches" ]; then
              echo "❌ Found forbidden VITE_ prefixed key: $pattern"
              echo "$matches"
              FOUND=1
            fi
          done

          echo "Scanning for hardcoded API key values..."
          KEY_PATTERNS=(
            "tvly-[A-Za-z0-9_-]{20,}"
            "pat_[A-Za-z0-9]{40,}"
            "sk-[a-f0-9]{32,}"
            "pk\.eyJ1Ijoi[A-Za-z0-9_-]{20,}"
          )

          for pattern in "${KEY_PATTERNS[@]}"; do
            matches=$(grep -rEn --include="*.ts" --include="*.tsx" --include="*.js" --include="*.json" \
              "$pattern" apps/web/src/ 2>/dev/null || true)
            matches=$(echo "$matches" | grep -v "\.env" | grep -v "example" || true)
            if [ -n "$matches" ]; then
              echo "❌ Found hardcoded API key value matching: $pattern"
              echo "$matches" | cut -c 1-60
              FOUND=1
            fi
          done

          if [ "$FOUND" -eq 1 ]; then
            echo ""
            echo "🔴 SECURITY VIOLATION: Sensitive keys detected in source code!"
            exit 1
          fi

          echo "Verifying the web Worker API routes exist..."
          MISSING=0
          for fn in apps/web/worker/routes/chat.ts apps/web/worker/routes/deepseek.ts apps/web/worker/routes/gemini.ts apps/web/worker/routes/health.ts apps/web/worker/routes/integrations.ts apps/web/worker/routes/search.ts apps/web/worker/routes/tavily.ts; do
            if [ ! -f "$fn" ]; then
              echo "❌ Missing web Worker route: $fn"
              MISSING=1
            else
              echo "✅ $fn"
            fi
          done

          if [ ! -f apps/web/worker/index.ts ]; then
            echo "❌ Missing web Worker entrypoint: apps/web/worker/index.ts"
            MISSING=1
          else
            echo "✅ apps/web/worker/index.ts"
          fi

          if [ "$MISSING" -eq 1 ]; then
            echo "🔴 Required web Worker route files are missing!"
            exit 1
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: TypeCheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test

      - name: Build
        run: pnpm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_MAPBOX_TOKEN: ${{ secrets.VITE_MAPBOX_TOKEN }}

      - name: Secret scan (bundle)
        run: |
          echo "Scanning apps/web/dist/assets/ for leaked API keys..."
          FOUND=0

          PATTERNS=(
            "tvly-[A-Za-z0-9_-]{20,}"
            "pat_[A-Za-z0-9]{40,}"
            "sk-[a-f0-9]{32,}"
            "DEEPSEEK_API_KEY"
            "TAVILY_API_KEY"
            "GOOGLE_API_KEY"
            "GEMINI_API_KEY"
            "COZE_API_TOKEN"
          )

          for pattern in "${PATTERNS[@]}"; do
            matches=$(grep -rEn "$pattern" apps/web/dist/assets/ 2>/dev/null || true)
            if [ -n "$matches" ]; then
              echo "❌ Leaked secret found in bundle: $pattern"
              echo "$matches" | head -3 | cut -c 1-80
              FOUND=1
            fi
          done

          if [ "$FOUND" -eq 1 ]; then
            echo ""
            echo "🔴 SECURITY VIOLATION: Sensitive keys detected in compiled JS bundle!"
            echo "   This means a key leaked into the frontend. Check vite.config.ts define{} block."
            exit 1
          fi

          echo "✅ Bundle is clean — no sensitive keys found in apps/web/dist/assets/."

      - name: Deploy notice
        if: github.event_name == 'push'
        run: |
          echo "✅ All CI checks passed."
          echo " → The web Worker deploys from main via Cloudflare Workers Builds."
