name: Deploy Status

on:
  workflow_call:

jobs:
  deploy-status:
    name: Cloudflare Deploy Status
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - name: Notify deploy triggered
        run: |
          echo "✅ All CI checks passed."
          echo " → Lint: passed"
          echo " → Style: passed"
          echo " → Style (Markdown): passed"
          echo " → TypeCheck: passed"
          echo " → Build: passed"
          echo " → Secret scan: passed (source + bundle)"
          echo " → Cloudflare Pages will auto-deploy this push."
