name: Bundle Secret Scan

on:
  workflow_call:
    inputs:
      ref:
        type: string
        required: false
        default: ${{ github.ref }}
    secrets:
      vite_supabase_url:
        required: true
      vite_supabase_anon_key:
        required: true
      vite_mapbox_token:
        required: true
      vite_coze_bot_id:
        required: true

jobs:
  bundle-scan:
    name: Bundle Secret Scan (dist)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - uses: actions/cache@v5
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install

      - name: Build (for bundle scan)
        run: pnpm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.vite_supabase_url }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.vite_supabase_anon_key }}
          VITE_MAPBOX_TOKEN: ${{ secrets.vite_mapbox_token }}
          VITE_COZE_BOT_ID: ${{ secrets.vite_coze_bot_id }}

      - name: Scan compiled bundle for leaked secrets
        run: |
          echo "Scanning dist/assets/ for leaked API keys..."
          FOUND=0

          PATTERNS=(
            "tvly-[A-Za-z0-9_-]{20,}"
            "pat_[A-Za-z0-9]{40,}"
            "sk-[a-f0-9]{32,}"
            "DEEPSEEK_API_KEY"
            "TAVILY_API_KEY"
            "GOOGLE_API_KEY"
            "GEMINI_API_KEY"
            "COZE_API_TOKEN"
          )

          for pattern in "${PATTERNS[@]}"; do
            matches=$(grep -rEn "$pattern" dist/assets/ 2>/dev/null || true)
            if [ -n "$matches" ]; then
              echo "❌ Leaked secret found in bundle: $pattern"
              echo "$matches" | head -3 | sed 's/\(.\{80\}\).*/\1.../'
              FOUND=1
            fi
          done

          if [ "$FOUND" -eq 1 ]; then
            echo ""
            echo "🔴 SECURITY VIOLATION: Sensitive keys detected in compiled JS bundle!"
            echo "   This means a key leaked into the frontend. Check vite.config.ts define{} block."
            exit 1
          fi

          echo "✅ Bundle is clean — no sensitive keys found in dist/assets/."

      - name: Verify CF Functions exist for sensitive APIs
        run: |
          echo "Verifying CF Pages Functions proxy files exist..."
          MISSING=0

          for fn in functions/api/deepseek.ts functions/api/tavily.ts functions/api/gemini.ts; do
            if [ ! -f "$fn" ]; then
              echo "❌ Missing CF Function proxy: $fn"
              MISSING=1
            else
              echo "✅ $fn"
            fi
          done

          if [ "$MISSING" -eq 1 ]; then
            echo "🔴 Required CF Function proxy files are missing!"
            exit 1
          fi
