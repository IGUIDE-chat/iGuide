name: Secret Scan (Source)

on:
  workflow_call:
    inputs:
      full_repo_name:
        type: string
        required: false
        default: ${{ github.repository }}
      ref:
        type: string
        required: false
        default: ${{ github.ref }}

jobs:
  secret-scan:
    name: Secret Scan (Source)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      # Block any VITE_-prefixed sensitive key in source code
      - name: Check for VITE_-prefixed sensitive keys in source
        run: |
          echo "Scanning for VITE_-prefixed sensitive keys in src/..."
          FOUND=0

          # These patterns indicate a sensitive key was accidentally given VITE_ prefix
          PATTERNS=(
            "VITE_.*API_KEY"
            "VITE_.*API_TOKEN"
            "VITE_.*SECRET"
            "VITE_DEEPSEEK"
            "VITE_TAVILY"
            "VITE_COZE_API"
            "VITE_GOOGLE_API"
            "VITE_GEMINI_API"
          )

          for pattern in "${PATTERNS[@]}"; do
            matches=$(grep -rn --include="*.ts" --include="*.tsx" --include="*.js" \
              "$pattern" app/src/ 2>/dev/null || true)
            if [ -n "$matches" ]; then
              echo "❌ Found forbidden VITE_ prefixed key: $pattern"
              echo "$matches"
              FOUND=1
            fi
          done

          if [ "$FOUND" -eq 1 ]; then
            echo ""
            echo "🔴 SECURITY VIOLATION: Sensitive API keys with VITE_ prefix detected!"
            echo "   VITE_-prefixed variables are compiled into the frontend JS bundle."
            echo "   Use CF Pages Functions (functions/api/*.ts) to proxy these keys server-side."
            exit 1
          fi

          echo "✅ No sensitive VITE_-prefixed keys found in source."

      # Block hardcoded key values (real key patterns)
      - name: Check for hardcoded API key values
        run: |
          echo "Scanning for hardcoded API key values..."
          FOUND=0

          # Common key prefixes that should NEVER appear as literal values
          PATTERNS=(
            "tvly-[A-Za-z0-9_-]{20,}"
            "pat_[A-Za-z0-9]{40,}"
            "sk-[a-f0-9]{32,}"
            "pk\.eyJ1Ijoi[A-Za-z0-9_-]{20,}"
          )

          for pattern in "${PATTERNS[@]}"; do
            matches=$(grep -rEn --include="*.ts" --include="*.tsx" --include="*.js" --include="*.json" \
              "$pattern" app/src/ 2>/dev/null || true)
            # Exclude .env files and example files
            matches=$(echo "$matches" | grep -v "\.env" | grep -v "example" || true)
            if [ -n "$matches" ]; then
              echo "❌ Found hardcoded API key value matching: $pattern"
              echo "$matches" | sed 's/\(.\{60\}\).*/\1.../' # truncate for safety
              FOUND=1
            fi
          done

          if [ "$FOUND" -eq 1 ]; then
            echo ""
            echo "🔴 SECURITY VIOLATION: Hardcoded API key values detected in source!"
            exit 1
          fi

          echo "✅ No hardcoded API key values found."