name = "api-gateway"
main = "src/index.ts"
compatibility_date = "2024-01-27"
compatibility_flags = ["nodejs_compat"]

# Routes - bind to your domain
# Uncomment and update with your actual domain
# routes = [
#   { pattern = "api.iguide.chat/*", zone_name = "iguide.chat" }
# ]

# For local development, secrets are loaded from .dev.vars
# For production, use: wrangler secret put <SECRET_NAME>

# Production environment variables
# Set these using: wrangler secret put <NAME>
# 
# Required secrets:
# - SUPABASE_URL
# - SUPABASE_ANON_KEY
# - DEEPSEEK_API_KEY
# - SILICONFLOW_API_KEY
# - BACKEND_URL
# - QMD_API_URL_GLOBAL   (Chicago VPS QMD daemon URL)
# - QMD_API_URL_CN       (Alibaba Cloud QMD daemon URL)
# - QMD_API_KEY           (Optional: shared secret for QMD auth)

[env.production]
# Production-specific configuration
# Secrets are set via: wrangler secret put <NAME> --env production

[env.development]
# Development environment
# Uses .dev.vars file for secrets
