<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>伊利诺伊指南 - UIUC 新生知识库</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
      body { 
        font-family: 'Plus Jakarta Sans', sans-serif; 
        background-color: #F8FAFC;
        /* Subtle mesh gradient background */
        background-image: 
          radial-gradient(at 0% 0%, rgba(19, 41, 75, 0.05) 0px, transparent 50%),
          radial-gradient(at 100% 0%, rgba(255, 95, 5, 0.05) 0px, transparent 50%);
        background-attachment: fixed;
      }
      
      /* Hide scrollbar for Chrome, Safari and Opera */
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      /* Hide scrollbar for IE, Edge and Firefox */
      .no-scrollbar {
        -ms-overflow-style: none;  /* IE and Edge */
        scrollbar-width: none;  /* Firefox */
      }

      /* Custom UIUC Colors extensions */
      .bg-illini-blue { background-color: #13294B; }
      .text-illini-blue { color: #13294B; }
      .bg-illini-orange { background-color: #FF5F05; }
      .text-illini-orange { color: #FF5F05; }
      
      /* Glassmorphism utilities */
      .glass {
        background: rgba(255, 255, 255, 0.7);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.5);
      }
      
      .glass-card {
        background: rgba(255, 255, 255, 0.85);
        backdrop-filter: blur(8px);
        border: 1px solid rgba(255, 255, 255, 0.6);
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03);
      }
    </style>
  <script type="importmap">

  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>

</html>
