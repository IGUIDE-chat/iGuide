<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content" />
  <title>IlliniGuide - UIUC New Student Knowledge Base</title>
  <!-- DNS prefetch for critical external domains -->
  <link rel="dns-prefetch" href="https://api.mapbox.com">
  <link rel="dns-prefetch" href="https://api.deepseek.com">
  <!-- Font loading: reduced weights (400,600,700) + async loading -->
  <link rel="preconnect" href="https://fonts.font.im" crossorigin>
  <link href="https://fonts.font.im/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap"
    rel="stylesheet" media="print" onload="this.media='all'">
  <noscript><link href="https://fonts.font.im/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet"></noscript>
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #F8FAFC;
      /* Subtle mesh gradient background */
      background-image:
        radial-gradient(at 0% 0%, rgba(19, 41, 75, 0.05) 0px, transparent 50%),
        radial-gradient(at 100% 0%, rgba(255, 95, 5, 0.05) 0px, transparent 50%);
      background-attachment: fixed;
    }

    /* Hide scrollbar for Chrome, Safari and Opera */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }

    /* Hide scrollbar for IE, Edge and Firefox */
    .no-scrollbar {
      -ms-overflow-style: none;
      /* IE and Edge */
      scrollbar-width: none;
      /* Firefox */
    }

    /* Custom UIUC Colors extensions */
    .bg-illini-blue {
      background-color: #13294B;
    }

    .text-illini-blue {
      color: #13294B;
    }

    .bg-illini-orange {
      background-color: #FF5F05;
    }

    .text-illini-orange {
      color: #FF5F05;
    }

    /* Glassmorphism utilities */
    .glass {
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.5);
    }

    .glass-card {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.6);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03);
    }
  </style>
</head>

<body
  class="h-[100dvh] text-slate-800 antialiased selection:bg-orange-100 selection:text-orange-900 overscroll-y-contain">
  <div id="root" class="h-full flex flex-col"></div>
  <script type="module" src="/src/index.tsx"></script>
</body>

</html>
