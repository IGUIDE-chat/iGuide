name = "illiniguide"
compatibility_date = "2024-01-27"

# Cloudflare Pages Configuration
# 
# Build settings should be configured in the Cloudflare Pages dashboard:
# - Build command: npm run build
# - Build output directory: dist
# - Root directory: illiniguide---uiuc-knowledge-base
# - Node.js version: 18
#
# Environment variables should also be set in the dashboard:
# Settings → Environment variables
# 
# Required variables:
# - VITE_SUPABASE_URL
# - VITE_SUPABASE_ANON_KEY
# - VITE_DEEPSEEK_API_KEY (production only)
# - VITE_SILICONFLOW_API_KEY (production only)
# - VITE_BACKEND_URL

