name = "illiniguide"
compatibility_date = "2024-01-27"

# Pages configuration
pages_build_output_dir = "dist"

[build]
command = "npm run build"

# Note: Environment variables should be set in Cloudflare Pages dashboard
# Go to: Settings → Environment variables
# 
# Required variables:
# - VITE_SUPABASE_URL
# - VITE_SUPABASE_ANON_KEY
# - VITE_DEEPSEEK_API_KEY (production only)
# - VITE_SILICONFLOW_API_KEY (production only)
# - VITE_BACKEND_URL
#
# Node.js version is set automatically by Cloudflare Pages (v18)

# Compatibility flags (must be array format)
compatibility_flags = ["nodejs_compat"]
