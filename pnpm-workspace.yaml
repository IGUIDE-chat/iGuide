packages:
  - apps/*
  - packages/*
  - tools/*

allowBuilds:
  "@mongodb-js/zstd": true
  core-js-pure: true
  esbuild: true
  node-liblzma: true
  sharp: true
  workerd: true
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.4.0
  vite-plus: 1.4.0
overrides:
  vite@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
